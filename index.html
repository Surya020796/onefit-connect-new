function toast(msg){let t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2300)}
function goHome(){current.role=null;document.getElementById('sidebar').classList.remove('show');document.getElementById('homeBtn').style.display='none';document.getElementById('roleTag').textContent='';renderHome()}
function enter(role){current.role=role;document.getElementById('homeBtn').style.display='inline-block';document.getElementById('roleTag').textContent=role.toUpperCase();let nav=role==='member'?[['Overview','member'],['Find classes','classes'],['My bookings','mybookings']]:role==='staff'?[['Overview','staff'],['Class roster','roster'],['Attendance','attendance']]:[['Overview','manager'],['Classes & schedules','manageclasses'],['Members','members'],['Reports','reports']];document.getElementById('sidebar').innerHTML='<div class="navlabel">WORKSPACE</div>'+nav.map((n,i)=>`<button class="navbtn ${i===0?'active':''}" onclick="navigate('${n[1]}',this)">${n[0]}</button>`).join('');document.getElementById('sidebar').classList.add('show');navigate(nav[0][1])}
function navigate(page,btn){if(btn){document.querySelectorAll('.navbtn').forEach(b=>b.classList.remove('active'));btn.classList.add('active')}({member:memberHome,classes:classBrowser,mybookings:myBookings,staff:staffHome,roster:roster,attendance:attendancePage,manager:managerHome,manageclasses:manageClasses,members:membersPage,reports:reportsPage}[page]||memberHome)()}
function memberLogin(event){event.preventDefault();const raw=document.getElementById('memberLoginName').value.trim();const normalized=raw.toLocaleLowerCase().replace(/\s+/g,' ');const matches=members.filter(m=>m.id.toLowerCase()===normalized||m.name.toLocaleLowerCase().trim().replace(/\s+/g,' ')===normalized);if(matches.length===0){toast('Member not found. Please check your name or Member ID.');document.getElementById('memberLoginName').focus();return;}if(matches.length>1){toast('Multiple members share this name. Please use your Member ID.');return;}current.memberId=matches[0].id;document.getElementById('memberLoginPassword').value='';enter('member');}
function toggleMemberPassword(){let input=document.getElementById('memberLoginPassword'),button=document.querySelector('.show-password');if(!input||!button)return;input.type=input.type==='password'?'text':'password';button.textContent=input.type==='password'?'Show':'Hide';}
function renderHome(){document.getElementById('app').innerHTML=`
<section class="hero"><h1>YOUR STUDIO. EVERYWHERE.</h1><p>ONEFIT / STUDIO OS — one membership, three locations, one connected experience.</p></section>
<div class="role-grid grid">
<article class="role-card"><div class="role-image" style="background-image:var(--gym-image)"></div><h3>Member</h3><p>Book and manage classes across all three locations using one membership.</p><form class="member-login" onsubmit="memberLogin(event)"><label for="memberLoginName">Full name or Member ID</label><input id="memberLoginName" name="identity" placeholder="e.g. M001 or Aisha Khan" autocomplete="off" required><label for="memberLoginPassword">Password <span class="optional">(optional)</span></label><div class="password-row"><input id="memberLoginPassword" name="password" type="password" placeholder="Not required for demo" autocomplete="off"><button type="button" class="show-password" onclick="toggleMemberPassword()" aria-label="Show or hide password">Show</button></div><p class="login-help">Demo access: enter your registered name or Member ID. Password is not checked or saved.</p><button type="submit">Log in to Member Portal →</button></form><button class="secondary" onclick="newMember()">New here? Create an account</button></article>
<article class="role-card"><div class="role-image" style="background-image:var(--gym-image)"></div><h3>Front-desk staff</h3><p>Check members in, view class rosters and record attendance at your studio.</p><select id="staffLocation">${locations.map(l=>`<option>${l}</option>`).join('')}</select><button onclick="current.location=document.getElementById('staffLocation').value;enter('staff')">Enter as staff</button></article>
<article class="role-card"><div class="role-image" style="background-image:var(--gym-image)"></div><h3>Manager</h3><p>See utilization, attendance and member activity across all locations.</p><div style="flex:1"></div><button onclick="enter('manager')">Enter as manager</button></article>
</div><div class="notice"><b>Prototype note:</b> This is a redesigned concept built from the original project feature documentation, with synthetic sample data stored in this browser. No real member or payment information is collected. Some original features (waitlist, churn scoring, messages, ratings and event log) are planned for the next build, not implemented here.</div><div class="footer">ONEFIT / STUDIO OS · Concept build · Synthetic data</div>`}
function heading(title,sub,action=''){return `<div class="section-head"><div><h2>${title}</h2><div class="muted small">${sub||''}</div></div>${action}</div>`}
function kpi(label,value,hint='Prototype data'){return `<div class="kpi"><div class="label">${label}</div><div class="value">${value}</div><div class="hint">${hint}</div></div>`}
function memberHome(){let m=members.find(x=>x.id===current.memberId)||members[0],mine=bookings.filter(b=>b.memberId===m.id&&b.status==='Booked');document.getElementById('app').innerHTML=`${heading('Welcome, '+esc(m.name),'Membership status: Active · Member ID: '+m.id)}<div class="grid kpis">${kpi('Membership','Active','One membership · 3 locations')}${kpi('Upcoming bookings',mine.length,'Across all studios')}${kpi('Available locations','3','Use any participating studio')}${kpi('Attendance',attendance.filter(a=>a.memberId===m.id&&a.status==='Present').length,'Recorded visits')}</div><div class="grid two-col"><div class="card">${heading('Your next classes','Your active reservations')} ${mine.length?mine.map(b=>{let c=classes.find(c=>c.id===b.classId);return c?`<div class="tutorial-step"><b>${esc(c.name)}</b><div class="muted small">${c.date} · ${c.time} · ${c.location}</div></div>`:''}).join(''):'<div class="empty">No upcoming bookings yet. Find a class to get started.</div>'}<button onclick="navigate('classes')">Find a class</button></div><div class="card">${heading('One membership, three locations','Book at any studio')}<p class="muted">Your membership works across all three OneFit locations. Choose a class based on your schedule, not the studio where you signed up.</p><div class="notice">Bookings, cancellations and attendance are reflected in the shared prototype data.</div><button class="secondary" onclick="navigate('mybookings')">View my bookings</button></div></div>`}
function classBrowser(){let loc=document.getElementById('locFilter')?.value||'All locations',type=document.getElementById('typeFilter')?.value||'All types',m=members.find(x=>x.id===current.memberId)||members[0];let list=classes.filter(c=>(loc==='All locations'||c.location===loc)&&(type==='All types'||c.type===type));document.getElementById('app').innerHTML=`${heading('Find a class','Browse classes at all three locations')}<div class="toolbar"><select id="locFilter" onchange="classBrowser()"><option>All locations</option>${locations.map(l=>`<option ${l===loc?'selected':''}>${l}</option>`)}</select><select id="typeFilter" onchange="classBrowser()"><option>All types</option>${['Strength','Yoga','HIIT','Pilates','Cycling'].map(t=>`<option ${t===type?'selected':''}>${t}</option>`)}</select></div><div class="grid class-grid" style="margin-top:17px">${list.map(c=>{let booked=bookings.some(b=>b.classId===c.id&&b.memberId===m.id&&b.status==='Booked'),full=c.booked>=c.capacity;return `<div class="card class-card"><span class="pill">${esc(c.location)}</span><h3 style="margin-top:10px">${esc(c.name)}</h3><div class="meta">${esc(c.type)} · ${c.date} · ${esc(c.time)}<br>Instructor: ${esc(c.instructor)}</div><div class="bottom"><span class="small muted">${Math.max(0,c.capacity-c.booked)} seats left</span>${booked?'<span class="pill green">Booked</span>':full?'<span class="pill red">Full</span>':`<button onclick="bookClass('${c.id}')">Book class</button>`}</div></div>`}).join('')||'<div class="empty">No classes match these filters.</div>'}</div>`}
function bookClass(id){let c=classes.find(x=>x.id===id),m=members.find(x=>x.id===current.memberId);if(!c||c.booked>=c.capacity)return toast('Sorry, this class is full.');if(bookings.some(b=>b.classId===id&&b.memberId===m.id&&b.status==='Booked'))return toast('You already booked this class.');bookings.push({id:'B'+Date.now(),memberId:m.id,classId:id,status:'Booked'});c.booked++;save();toast('Class booked successfully.');classBrowser()}
function cancelBooking(id){let b=bookings.find(x=>x.id===id),c=classes.find(x=>x.id===b.classId);if(!b||b.status!=='Booked')return;b.status='Cancelled';if(c)c.booked=Math.max(0,c.booked-1);save();myBookings();toast('Booking cancelled.')}
function myBookings(){let mine=bookings.filter(b=>b.memberId===current.memberId);document.getElementById('app').innerHTML=`${heading('My bookings','Manage your reservations across all locations')}<div class="card table-wrap"><table class="table"><thead><tr><th>Class</th><th>Location</th><th>Date & time</th><th>Status</th><th>Action</th></tr></thead><tbody>${mine.map(b=>{let c=classes.find(x=>x.id===b.classId);return `<tr><td>${esc(c?.name||'Class')}</td><td>${esc(c?.location||'-')}</td><td>${c?.date||'-'} · ${c?.time||'-'}</td><td><span class="pill ${b.status==='Booked'?'green':'red'}">${b.status}</span></td><td>${b.status==='Booked'?`<button class="danger" onclick="cancelBooking('${b.id}')">Cancel</button>`:'—'}</td></tr>`}).join('')||'<tr><td colspan="5" class="empty">No bookings yet.</td></tr>'}</tbody></table></div>`}
function staffHome(){let cs=classes.filter(c=>c.location===current.location),bs=bookings.filter(b=>b.status==='Booked'&&cs.some(c=>c.id===b.classId));document.getElementById('app').innerHTML=`${heading('Front-desk workspace',current.location+' · Staff view')}<div class="grid kpis">${kpi('Classes today',cs.filter(c=>c.date===today(0)).length)}${kpi('Active bookings',bs.length)}${kpi('Members',members.length)}${kpi('Attendance marked',attendance.filter(a=>cs.some(c=>c.id===a.classId)).length)}</div><div class="card">${heading('Today at '+current.location,'Select a class to view its roster')}<div class="table-wrap"><table class="table"><thead><tr><th>Class</th><th>Time</th><th>Instructor</th><th>Bookings</th><th></th></tr></thead><tbody>${cs.filter(c=>c.date===today(0)).map(c=>`<tr><td>${esc(c.name)}</td><td>${c.time}</td><td>${esc(c.instructor)}</td><td>${c.booked}/${c.capacity}</td><td><button onclick="openRoster('${c.id}')">Open roster</button></td></tr>`).join('')||'<tr><td colspan="5">No classes scheduled today at this location.</td></tr>'}</tbody></table></div></div>`}
function roster(){let cs=classes.filter(c=>c.location===current.location);document.getElementById('app').innerHTML=`${heading('Class roster','Choose a class at '+current.location)}<div class="card"><div class="table-wrap"><table class="table"><thead><tr><th>Class</th><th>Date</th><th>Time</th><th>Instructor</th><th>Enrolled</th><th></th></tr></thead><tbody>${cs.map(c=>`<tr><td>${esc(c.name)}</td><td>${c.date}</td><td>${c.time}</td><td>${esc(c.instructor)}</td><td>${c.booked}/${c.capacity}</td><td><button onclick="openRoster('${c.id}')">View members</button></td></tr>`).join('')}</tbody></table></div></div>`}
function openRoster(id){let c=classes.find(x=>x.id===id),bs=bookings.filter(b=>b.classId===id&&b.status==='Booked');document.getElementById('modal').innerHTML=`<h2>${esc(c.name)} · Roster</h2><p class="muted small">${c.location} · ${c.date} · ${c.time}</p>${bs.map(b=>{let m=members.find(x=>x.id===b.memberId),a=attendance.find(x=>x.bookingId===b.id);return `<div class="tutorial-step"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center"><div><b>${esc(m?.name||b.memberId)}</b><div class="small muted">${b.memberId}</div></div><button class="${a?.status==='Present'?'secondary':''}" onclick="markAttendance('${b.id}','${id}')">${a?.status==='Present'?'Present ✓':'Mark present'}</button></div></div>`}).join('')||'<div class="empty">No members booked into this class.</div>'}<div style="text-align:right;margin-top:15px"><button class="secondary" onclick="closeModal()">Close</button></div>`;openModal()}
function markAttendance(bookingId,classId){let b=bookings.find(x=>x.id===bookingId),old=attendance.find(x=>x.bookingId===bookingId);if(old){old.status='Present';old.markedAt=new Date().toISOString()}else attendance.push({bookingId,classId,memberId:b.memberId,status:'Present',markedAt:new Date().toISOString()});save();openRoster(classId);toast('Attendance updated.')}
function attendancePage(){let cs=classes.filter(c=>c.location===current.location);document.getElementById('app').innerHTML=`${heading('Attendance records','Attendance recorded by staff at '+current.location)}<div class="card table-wrap"><table class="table"><thead><tr><th>Member</th><th>Class</th><th>Date</th><th>Status</th></tr></thead><tbody>${attendance.filter(a=>cs.some(c=>c.id===a.classId)).map(a=>{let m=members.find(x=>x.id===a.memberId),c=classes.find(x=>x.id===a.classId);return `<tr><td>${esc(m?.name)}</td><td>${esc(c?.name)}</td><td>${c?.date}</td><td><span class="pill green">Present</span></td></tr>`}).join('')||'<tr><td colspan="4" class="empty">No attendance records yet. Open a class roster to mark attendance.</td></tr>'}</tbody></table></div>`}
function managerHome(){let totalBooked=bookings.filter(b=>b.status==='Booked').length,att=attendance.length,occ=classes.reduce((s,c)=>s+c.booked,0)/Math.max(1,classes.reduce((s,c)=>s+c.capacity,0))*100;document.getElementById('app').innerHTML=`${heading('Management dashboard','Centralized view · All three locations')}<div class="grid kpis">${kpi('Active members',members.filter(m=>m.status==='Active').length,'Across all locations')}${kpi('Active bookings',totalBooked,'Current reservations')}${kpi('Class occupancy',Math.round(occ)+'%','Booked seats / total capacity')}${kpi('Attendance records',att,'Marked present')}</div><div class="grid two-col"><div class="card">${heading('Bookings by location','Active bookings grouped by studio')}${barChart(locations.map(l=>({label:l.replace('Location ', 'Loc '),value:bookings.filter(b=>b.status==='Booked'&&classes.find(c=>c.id===b.classId)?.location===l).length})))}</div><div class="card">${heading('Location snapshot','Classes and capacity')}${locations.map(l=>{let cs=classes.filter(c=>c.location===l),b=cs.reduce((s,c)=>s+c.booked,0),cap=cs.reduce((s,c)=>s+c.capacity,0);return `<div class="tutorial-step"><div style="display:flex;justify-content:space-between"><b>${l}</b><b>${cap?Math.round(b/cap*100):0}%</b></div><div class="small muted">${cs.length} classes · ${b}/${cap} seats booked</div><div style="height:7px;background:#edf1f8;border-radius:8px;margin-top:8px;overflow:hidden"><div style="height:100%;width:${cap?b/cap*100:0}%;background:#527be8"></div></div></div>`}).join('')}</div></div><div class="card" style="margin-top:16px">${heading('Popular classes','Based on current reservations')}<div class="table-wrap"><table class="table"><thead><tr><th>Class</th><th>Location</th><th>Instructor</th><th>Booked</th><th>Capacity</th><th>Occupancy</th></tr></thead><tbody>${[...classes].sort((a,b)=>b.booked-a.booked).slice(0,5).map(c=>`<tr><td>${esc(c.name)}</td><td>${c.location}</td><td>${esc(c.instructor)}</td><td>${c.booked}</td><td>${c.capacity}</td><td>${Math.round(c.booked/c.capacity*100)}%</td></tr>`).join('')}</tbody></table></div></div>`}
function barChart(data){let max=Math.max(1,...data.map(x=>x.value));return `<div class="chart-bars">${data.map(x=>`<div class="bar-col"><b>${x.value}</b><div class="bar" style="height:${Math.max(5,x.value/max*125)}px"></div><span>${x.label}</span></div>`).join('')}</div>`}
function manageClasses(){document.getElementById('app').innerHTML=`${heading('Classes & schedules','Manage shared class listings and local studio schedules','<button onclick="addClass()">+ Add class</button>')}<div class="notice">Managers can add classes for a specific location. The member portal immediately displays the updated schedule.</div><div class="card table-wrap"><table class="table"><thead><tr><th>Class</th><th>Location</th><th>Date</th><th>Time</th><th>Instructor</th><th>Seats</th><th>Action</th></tr></thead><tbody>${classes.map(c=>`<tr><td>${esc(c.name)}</td><td>${c.location}</td><td>${c.date}</td><td>${c.time}</td><td>${esc(c.instructor)}</td><td>${c.booked}/${c.capacity}</td><td><button class="danger" onclick="deleteClass('${c.id}')">Remove</button></td></tr>`).join('')}</tbody></table></div>`}
function addClass(){document.getElementById('modal').innerHTML=`<h2>Add a class</h2><form onsubmit="saveClass(event)"><div class="form-row"><label>Class name<input name="name" required placeholder="e.g. Power Yoga"></label><label>Class type<select name="type"><option>Strength</option><option>Yoga</option><option>HIIT</option><option>Pilates</option><option>Cycling</option></select></label><label>Location<select name="location">${locations.map(l=>`<option>${l}</option>`)}</select></label><label>Date<input type="date" name="date" required value="${today(1)}"></label><label>Time<input name="time" required placeholder="05:00 PM"></label><label>Instructor<input name="instructor" required placeholder="Instructor name"></label><label>Capacity<input type="number" name="capacity" min="1" max="40" value="12" required></label></div><div class="actions" style="justify-content:flex-end"><button type="button" class="secondary" onclick="closeModal()">Cancel</button><button>Save class</button></div></form>`;openModal()}
function saveClass(e){e.preventDefault();let f=new FormData(e.target);classes.push({id:'C'+Date.now(),name:f.get('name'),type:f.get('type'),location:f.get('location'),date:f.get('date'),time:f.get('time'),instructor:f.get('instructor'),capacity:+f.get('capacity'),booked:0});save();closeModal();manageClasses();toast('New class added to shared schedule.')}
function deleteClass(id){if(!confirm('Remove this class from the prototype schedule?'))return;classes=classes.filter(c=>c.id!==id);bookings=bookings.filter(b=>b.classId!==id);attendance=attendance.filter(a=>a.classId!==id);save();manageClasses();toast('Class removed.')}
function membersPage(){document.getElementById('app').innerHTML=`${heading('Members','Shared membership directory across all locations')}<div class="card table-wrap"><table class="table"><thead><tr><th>Member ID</th><th>Name</th><th>Home location</th><th>Email (sample)</th><th>Status</th></tr></thead><tbody>${members.map(m=>`<tr><td>${m.id}</td><td>${esc(m.name)}</td><td>${m.location}</td><td>${esc(m.email||'Not provided')}</td><td><span class="pill green">${m.status}</span></td></tr>`).join('')}</tbody></table></div>`}
function reportsPage(){let active=bookings.filter(b=>b.status==='Booked').length,att=attendance.length;document.getElementById('app').innerHTML=`${heading('Reports & insights','Prototype operational metrics')}<div class="grid kpis">${kpi('Total class sessions',classes.length)}${kpi('Active reservations',active)}${kpi('Attendance marked',att)}${kpi('Locations connected',3)}</div><div class="grid two-col"><div class="card">${heading('Class occupancy by location','Booked seats divided by available seats')}${barChart(locations.map(l=>{let cs=classes.filter(c=>c.location===l),cap=cs.reduce((s,c)=>s+c.capacity,0),b=cs.reduce((s,c)=>s+c.booked,0);return {label:l.replace('Location ','Loc '),value:cap?Math.round(b/cap*100):0}}))}<p class="small muted">Values are percentages based on the sample class schedule.</p></div><div class="card">${heading('Data integration status','One shared prototype data store')}<div class="tutorial-step"><b>Membership</b><div class="small muted">Shared member directory across all locations</div><span class="pill green">Simulated</span></div><div class="tutorial-step"><b>Bookings</b><div class="small muted">Cross-location reservations and seat counts</div><span class="pill green">Interactive</span></div><div class="tutorial-step"><b>Attendance</b><div class="small muted">Staff-entered records update reporting</div><span class="pill green">Interactive</span></div></div></div><div style="margin-top:16px"><button class="secondary" onclick="exportData()">Export prototype data (CSV)</button> <button class="danger" onclick="resetData()">Reset sample data</button></div>`}
function exportData(){let rows=[['Class','Location','Date','Instructor','Booked','Capacity'],...classes.map(c=>[c.name,c.location,c.date,c.instructor,c.booked,c.capacity])];let csv=rows.map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='onefit-prototype-classes.csv';a.click();URL.revokeObjectURL(a.href);toast('CSV export prepared.')}
function resetData(){if(!confirm('Reset all changes and restore the original sample data?'))return;classes=JSON.parse(JSON.stringify(seedClasses));members.splice(0,members.length,...JSON.parse(JSON.stringify(seedMembers)));bookings=[{id:'B001',memberId:'M001',classId:'C102',status:'Booked'},{id:'B002',memberId:'M002',classId:'C101',status:'Booked'},{id:'B003',memberId:'M003',classId:'C106',status:'Booked'}];attendance=[];save();reportsPage();toast('Sample data restored.')}
function newMember(){document.getElementById('modal').innerHTML=`<h2>Create sample member account</h2><form onsubmit="createMember(event)"><div class="form-row"><label>Full name<input name="name" required></label><label>Email<input type="email" name="email" required></label><label>Home location<select name="location">${locations.map(l=>`<option>${l}</option>`)}</select></label></div><div class="actions" style="justify-content:flex-end"><button type="button" class="secondary" onclick="closeModal()">Cancel</button><button>Create account</button></div></form>`;openModal()}
function createMember(e){e.preventDefault();let f=new FormData(e.target),m={id:'M'+String(Date.now()).slice(-5),name:f.get('name'),email:f.get('email'),location:f.get('location'),status:'Active'};members.push(m);save();current.memberId=m.id;closeModal();enter('member');toast('Sample member account created.')}
function openModal(){document.getElementById('modalBack').classList.add('show')}function closeModal(){document.getElementById('modalBack').classList.remove('show')}
function showTutorial(){document.getElementById('modal').innerHTML=`<h2>ONEFIT STUDIO OS · Quick tutorial</h2><p class="muted">A 2–3 minute walkthrough for the product owner.</p><div class="tutorial-step"><b>1. Member</b><div class="small muted">Enter as a member, browse all three locations, book a class and view or cancel the reservation.</div></div><div class="tutorial-step"><b>2. Front-desk staff</b><div class="small muted">Choose a studio, open a class roster and mark a booked member present.</div></div><div class="tutorial-step"><b>3. Manager</b><div class="small muted">Review the combined dashboard, add a local class and check reports.</div></div><div class="notice">All interactions use synthetic sample data in this browser. Refreshing the page preserves changes through localStorage.</div><div style="text-align:right"><button onclick="closeModal()">Close tutorial</button></div>`;openModal()}
renderHome();
</script>
<script src="./member-portal.js"></script>
</body></html>
